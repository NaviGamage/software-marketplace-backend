spring:
  application:
    name: software-marketplace

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:marketplace_db}
    username: marketplace_user
    password: marketplace_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Flyway owns the schema — Hibernate must never auto-generate/alter tables.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: ${SERVER_PORT:8080}

aws:
  region: ${AWS_REGION:ap-northeast-2}
  access-key: ${AWS_ACCESS_KEY:}
  secret-key: ${AWS_SECRET_KEY:}
  s3:
    endpoint: ${AWS_S3_ENDPOINT:https://dvcorobckqcftxplualt.storage.supabase.co/storage/v1/s3}
    bucket: ${AWS_S3_BUCKET:marketplace}

app:
  jwt:
    secret: ${JWT_SECRET:xtDctwHEtN5oLYKtZXdAF1zNHKbHhBow5vmfFsfHWPAwtGEQuQ5bKu40DJjESo50}
    access-token-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:900000}
    refresh-token-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000}
  download:
    token-expiry-ms: ${DOWNLOAD_TOKEN_EXPIRY_MS:3600000}
  escrow:
    hold-days: ${ESCROW_HOLD_DAYS:14}
  payout:
    minimum-amount: ${PAYOUT_MINIMUM_AMOUNT:20.00}
  platform:
    commission-rate: ${PLATFORM_COMMISSION_RATE:0.20}

logging:
  level:
    root: INFO
    com.marketplace: DEBUG
    org.hibernate.SQL: DEBUG




